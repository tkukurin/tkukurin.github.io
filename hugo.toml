baseURL = 'https://tkukurin.github.io/'
locale = 'en-us'
title = 'toni kukurin'
theme = 'archie'

# Code Highlight
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[pagination]
  pagerSize = 3 # articles per page

[params]
	mode="auto" # color-mode → light,dark,toggle or auto
	useCDN=true # don't use CDNs for fonts and icons, instead serve them locally.
	subtitle = "just miscellanea. [toni.leaflet.pub](https://toni.leaflet.pub)"
	mathjax = false # enable MathJax support
	katex = false # enable KaTeX support

